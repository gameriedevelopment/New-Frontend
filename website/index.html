<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="One living identity for the games you play, the people you meet, the teams you build, and every moment that proves you belong."
    />
    <link rel="canonical" href="https://gamerie.gg/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg" color="#c6a3ff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gamerie" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://gamerie.gg/" />
    <meta
      property="og:title"
      content="Gamerie — Your game life, finally in one place."
    />
    <meta
      property="og:description"
      content="Build your gaming identity, find your people, grow with your team, and turn every result into part of your story."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Gamerie — Your game life, finally in one place."
    />
    <meta
      name="twitter:description"
      content="One connected player network for identity, community, teams, competition, and opportunity."
    />
    <title>Gamerie — Your game life, finally in one place.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Gamerie",
        "url": "%VITE_WEBSITE_URL%/",
        "description": "One connected player network for gaming identity, community, teams, competition, and opportunity.",
        "potentialAction": {
          "@type": "RegisterAction",
          "target": "%VITE_APP_URL%/register",
          "name": "Create a Gamerie identity"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
